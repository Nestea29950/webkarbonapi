worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Redirection HTTP -> HTTPS
    server {
        listen 80;
        server_name api.webkarbon.bzh;
        return 301 https://$host$request_uri;
    }

    # Configuration HTTPS
    server {
        listen 443 ssl;
        server_name api.webkarbon.bzh;

        # Chemins des certificats
        ssl_certificate /etc/letsencrypt/live/api.webkarbon.bzh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.webkarbon.bzh/privkey.pem;

        # Paramètres SSL recommandés
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

        # Proxy vers votre application
        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}