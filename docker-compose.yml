services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
    networks:
      - web

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./certs/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - app
    networks:
      - web

networks:
  web:
    driver: bridge
