services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
    networks:
      - web

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./certs/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
      - ./certs/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - web

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/lib:/var/lib/letsencrypt
      - ./certs/www:/var/www/certbot
      - ./certs/ssl:/certs-ssl
    command: >
      sh -c "certbot certonly --webroot \
        --webroot-path=/var/www/certbot \
        --email ton-email@example.com \
        --agree-tos \
        --no-eff-email \
        -d api.webkarbon.bzh && \
      cp /etc/letsencrypt/live/api.webkarbon.bzh/fullchain.pem /certs-ssl/cert.pem && \
      cp /etc/letsencrypt/live/api.webkarbon.bzh/privkey.pem /certs-ssl/key.pem"
    networks:
      - web




networks:
  web:
    driver: bridge
